name: "Backend deps"
description: >
  Sets up Python 3.10, restores the pipenv virtualenv cache, and installs
  the backend's dependencies (including dev deps, since flake8/pytest live
  there). Shared by backend-ci.yaml and backend-cd.yaml so the lint/test/
  build jobs don't each repeat the same three steps.

runs:
  using: "composite"
  steps:
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Restore pipenv cache
      uses: actions/cache@v4
      with:
        path: ~/.local/share/virtualenvs
        key: ${{ runner.os }}-backend-pipenv-${{ hashFiles('starter/backend/Pipfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-backend-pipenv-

    - name: Install pipenv and project dependencies
      shell: bash
      working-directory: starter/backend
      run: |
        pip install pipenv
        pipenv install --dev
