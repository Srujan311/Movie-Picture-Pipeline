# Backend Continuous Deployment
#
# Same shape as frontend-cd.yaml: lint + test gate the build, the image gets
# tagged with the commit SHA and pushed to ECR, then kustomize/kubectl roll
# it out to the cluster. AWS creds come from repo secrets only.

name: Backend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - "starter/backend/**"
      - ".github/workflows/backend-cd.yaml"
      - ".github/actions/backend-deps/**"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: backend
  EKS_CLUSTER_NAME: cluster

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/backend-deps
      - working-directory: starter/backend
        run: pipenv run lint

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/backend-deps
      - working-directory: starter/backend
        run: pipenv run test

  build-and-push:
    name: Build & push to ECR
    runs-on: ubuntu-latest
    needs: [lint, test]
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/backend-deps

      - name: Assume the github-action-user credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push, tagged with the commit SHA
        id: build-image
        working-directory: starter/backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    name: Roll out to EKS
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Point kubectl at the EKS cluster
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - uses: azure/setup-kubectl@v4

      - name: Grab kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Point the manifests at the new image and apply
        working-directory: starter/backend/k8s
        run: |
          kustomize edit set image backend=${{ needs.build-and-push.outputs.image }}
          kustomize build | kubectl apply -f -

      - name: Wait for the rollout to finish
        run: kubectl rollout status deployment/backend
